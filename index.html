<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>JARVIS</h1>
      <div class="status"><span id="statusDot"></span><span id="statusText">OFFLINE</span></div>
    </header>

    <div id="loginPanel" class="panel">
      <h2>Initialize Jarvis</h2>
      <button id="loginBtn" class="primary">Continue with Google</button>
      <div id="loginMessage"></div>
    </div>

    <div id="dashboard" class="hidden">
      <div class="panel profile">
        <h3 id="userName">User</h3>
        <button id="logoutBtn" class="secondary">Sign Out</button>
      </div>

      <div class="panel">
        <button id="micBtn" class="mic-circle">🎤</button>
        <p id="micText">Say "Hey Jarvis"</p>
      </div>

      <div class="panel console">
        <div id="chatContainer" class="chat-box">
          <div class="msg jarvis">Jarvis online.</div>
        </div>
        <div class="input-row">
          <input id="commandInput" placeholder="Type here..." autocomplete="off">
          <button id="sendBtn" class="primary">Send</button>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
