<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>J.A.R.V.I.S — Classic Interface</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines"></div>
  <div class="bg-glow"></div>

  <main class="app">
    <header class="top-hud">
      <div class="hud-panel top-left">
        <div class="sys-text" id="systemStatus">SYS: OFFLINE</div>
        <div class="sys-sub" id="authState">AUTH: WAITING</div>
      </div>
      <div class="brand-title">J.A.R.V.I.S</div>
      <div class="hud-panel top-right">
        <div class="sys-text">CLOUD: <span id="profileState">WAITING</span></div>
      </div>
    </header>

    <section class="login-panel hidden" id="loginPanel">
      <h2>SYSTEM LOCK</h2>
      <p>Authorize access to initialize J.A.R.V.I.S.</p>
      <button id="loginBtn" class="btn-hud">Authenticate</button>
    </section>

    <section class="dashboard hidden" id="dashboard">
      
      <!-- Classic Animated Rings -->
      <div class="core-container">
        <div class="ring ring-outer"></div>
        <div class="ring ring-mid"></div>
        <div class="ring ring-inner"></div>
        <div class="core-orb">
          <div class="core-text">J.A.R.V.I.S</div>
        </div>
      </div>

      <!-- Chat Area -->
      <div class="hud-panel console-panel">
        <div class="panel-header">NEURAL INTERFACE</div>
        <div class="chat-container" id="chatContainer">
          <div class="msg jarvis">Systems initialized. How may I assist you, Sir?</div>
        </div>
        <div class="input-area">
          <span class="prompt">></span>
          <input id="commandInput" placeholder="Type command..." autocomplete="off">
          <button id="sendBtn" class="btn-send">SEND</button>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-grid">
        <div class="hud-panel mic-panel">
          <div class="mic-status" id="micIndicator">VOICE: OFF</div>
          <button id="micBtn" class="btn-mic">🎤</button>
          <div class="voice-controls">
            <button id="voiceToggle" class="btn-text">🔊 Audio ON</button>
            <button id="logoutBtn" class="btn-text text-danger">Log Out</button>
          </div>
        </div>

        <div class="hud-panel profile-panel">
          <div class="data-row"><span>OPERATOR</span><b id="userName">—</b></div>
          <div class="data-row"><span>NETWORK</span><b class="text-cyan">SECURE</b></div>
        </div>
      </div>

    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
