<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>J.A.R.V.I.S — Mark VII Interface</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Background Scanning Effect -->
  <div class="scanlines"></div>
  <div class="bg-glow"></div>

  <main class="app">
    <!-- TOP HUD PANEL -->
    <header class="top-hud">
      <div class="hud-panel top-left">
        <div class="sys-text">SYS: ONLINE</div>
        <div class="sys-sub" id="authState">AUTH: WAITING</div>
      </div>
      <div class="brand-title">J.A.R.V.I.S</div>
      <div class="hud-panel top-right">
        <div class="sys-text" id="statusText">STANDBY</div>
        <div class="sys-sub">CLOUD: <span id="profileState">WAITING</span></div>
      </div>
    </header>

    <!-- LOGIN PANEL (If not authenticated) -->
    <section class="login-panel hidden" id="loginPanel">
      <h2>SYSTEM LOCK</h2>
      <p>Authorize access to initialize J.A.R.V.I.S.</p>
      <button id="loginBtn" class="btn-hud">Authenticate via Google</button>
    </section>

    <!-- MAIN DASHBOARD -->
    <section class="dashboard hidden" id="dashboard">
      
      <!-- 1. CENTRAL CORE (THE ORB) -->
      <div class="core-container">
        <!-- Data Rings -->
        <div class="ring ring-inner"></div>
        <div class="ring ring-mid"></div>
        <div class="ring ring-outer"></div>
        
        <!-- The Orb -->
        <div class="orb" id="coreState">
          <div class="orb-inner"></div>
          <div class="orb-text">J.A.R.V.I.S</div>
        </div>
      </div>

      <!-- 2. CHAT / DATA CONSOLE -->
      <div class="hud-panel console-panel">
        <div class="panel-header">
          <span>NEURAL INTERFACE</span>
          <span class="blinking-dot"></span>
        </div>
        <div class="chat-container" id="chatContainer">
          <div class="msg jarvis">Systems initialized. How may I assist you, Sir?</div>
        </div>
        <div class="input-area">
          <span class="prompt">></span>
          <input id="commandInput" placeholder="Type or say 'Hey Jarvis'..." autocomplete="off">
          <button id="sendBtn" class="btn-send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>

      <!-- 3. FLOATING DATA PANELS (Controls) -->
      <div class="controls-grid">
        <div class="hud-panel mic-panel">
          <div class="mic-status" id="micIndicator">VOICE MODULE: OFF</div>
          <button id="micBtn" class="btn-mic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          </button>
          <div class="voice-controls">
            <button id="voiceToggle" class="btn-text">🔊 Audio ON</button>
            <button id="logoutBtn" class="btn-text text-danger">Log Out</button>
          </div>
        </div>

        <div class="hud-panel profile-panel">
          <div class="data-row"><span>OPERATOR</span><b id="userName">—</b></div>
          <div class="data-row"><span>NETWORK</span><b class="text-cyan">SECURE</b></div>
          <div class="data-row"><span>AI ENGINE</span><b class="text-cyan">GEMINI</b></div>
          <div class="data-row"><span>NODE</span><b class="text-cyan">RENDER</b></div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
