<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient"></div>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-orb"></div>
        <div>
          <div class="brand-name">JARVIS</div>
          <div class="brand-sub">PERSONAL AI SYSTEM</div>
        </div>
      </div>
      <div class="status">
        <span id="statusDot"></span><span id="statusText">OFFLINE</span>
      </div>
    </header>

    <section class="hero" id="heroSection">
      <div class="core-wrap">
        <div class="ring outer-ring"></div>
        <div class="ring middle-ring"></div>
        <div class="core-ring">
          <div class="core-inner">
            <div id="coreState" class="core-state">STANDBY</div>
          </div>
        </div>
      </div>
      <p id="greeting">Awaiting authentication.</p>
    </section>

    <section class="panel login-panel" id="loginPanel">
      <h2>Initialize Jarvis</h2>
      <p>Sign in to access your personal AI system.</p>
      <button id="loginBtn" class="primary">Continue with Google</button>
      <div id="loginMessage" class="message"></div>
    </section>

    <section class="dashboard hidden" id="dashboard">
      <!-- 1. CHAT CONSOLE (TOP) -->
      <div class="panel command">
        <div class="chat-container" id="chatContainer">
          <div class="chat-message jarvis-msg">Jarvis online. How may I assist you?</div>
        </div>
        <div class="command-line">
          <button id="micBtn" class="mic-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          </button>
          <input id="commandInput" placeholder="Type a command or say 'Hey Jarvis'..." autocomplete="off">
          <button id="sendBtn" class="send-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
        <div class="mic-status-row">
          <span id="micIndicator" class="mic-indicator"><span></span> MIC OFF</span>
          <button id="voiceToggle" class="text-btn">🔊 Voice: ON</button>
        </div>
      </div>

      <!-- 2. SYSTEM & PROFILE (BOTTOM) -->
      <div class="grid">
        <div class="panel profile-panel">
          <div class="eyebrow">AUTHORIZED PERSONNEL</div>
          <div id="userName" class="user-name">—</div>
          <div id="userEmail" class="user-email">—</div>
          <button id="logoutBtn" class="secondary small mt-2">Sign Out</button>
        </div>
        
        <div class="panel system-panel">
          <div class="eyebrow">SYSTEM STATUS</div>
          <div class="sys-row"><span>Auth Core</span><b id="authState">READY</b></div>
          <div class="sys-row"><span>Cloud Sync</span><b id="profileState">WAITING</b></div>
          <div class="sys-row"><span>Neural Net</span><b>GEMINI</b></div>
        </div>
      </div>
    </section>
    
    <footer>POWERED BY <strong>SHASHWAT</strong></footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
