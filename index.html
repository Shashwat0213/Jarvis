<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>J.A.R.V.I.S — AI Interface</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines"></div>
  <div class="bg-glow"></div>

  <main class="app">
    <header class="top-hud">
      <div class="hud-pill left-pill">
        <span class="dot"></span>
        <span id="systemStatus">SYS: OFFLINE</span>
      </div>
      <div class="brand-name">J.A.R.V.I.S</div>
      <div class="hud-pill right-pill">
        <span id="profileState">CLOUD: WAIT</span>
      </div>
    </header>

    <section class="login-panel hidden" id="loginPanel">
      <div class="login-glass">
        <h2>SYSTEM LOCK</h2>
        <p>Authorize access to initialize J.A.R.V.I.S.</p>
        <button id="loginBtn" class="btn-primary">Authenticate</button>
      </div>
    </section>

    <section class="dashboard hidden" id="dashboard">
      
      <!-- 3D HOLOGRAM CORE (Inspired by your Image) -->
      <div class="core-container">
        <!-- Rotating 3D Dots Sphere -->
        <div class="sphere-dots"></div>
        
        <!-- Outer Holographic Rings -->
        <div class="ring ring-outer"></div>
        <div class="ring ring-mid"></div>
        <div class="ring ring-inner"></div>
        
        <!-- Center Text -->
        <div class="core-orb" id="coreOrb">
          <div class="core-text">J.A.R.V.I.S</div>
        </div>
      </div>

      <!-- Chat Interface -->
      <div class="chat-interface">
        <div class="chat-header">
          <span>NEURAL LINK</span>
          <span class="status-live">● LIVE</span>
        </div>
        <div class="chat-box" id="chatContainer">
          <div class="msg jarvis">
            <div class="msg-content">Systems initialized. How may I assist you, Sir?</div>
          </div>
        </div>
        <div class="input-area">
          <input id="commandInput" placeholder="Type command..." autocomplete="off">
          <button id="sendBtn" class="btn-send">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-row">
        <div class="glass-panel mic-panel">
          <div class="mic-status" id="micIndicator">VOICE: OFF</div>
          <button id="micBtn" class="btn-mic">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
          </button>
        </div>

        <div class="glass-panel user-panel">
          <div class="data-row"><span>OPERATOR</span><b id="userName">—</b></div>
          <div class="data-row"><span>SECURITY</span><b class="text-cyan">SECURE</b></div>
          <div class="action-buttons">
            <button id="voiceToggle" class="btn-text">🔊 Audio ON</button>
            <button id="logoutBtn" class="btn-text red">Log Out</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
