<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JARVIS AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow"></div>

  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-dot"></div>
        <div class="brand-name">J.A.R.V.I.S</div>
      </div>
      <div class="status"><span id="statusDot"></span><span id="statusText">OFFLINE</span></div>
    </header>

    <!-- LOGIN PANEL -->
    <section class="panel login-panel" id="loginPanel">
      <h2>System Lock</h2>
      <p>Authorize access to initialize J.A.R.V.I.S.</p>
      <button id="loginBtn" class="primary">Authenticate via Google</button>
      <div id="loginMessage" class="message"></div>
    </section>

    <!-- DASHBOARD -->
    <section class="dashboard hidden" id="dashboard">
      
      <!-- JARVIS Animated Core -->
      <div class="jarvis-hero">
        <div class="radar-container">
          <div class="ring-outer"></div>
          <div class="ring-mid"></div>
          <div class="ring-inner"></div>
          <div class="ring-core"></div>
          <div class="jarvis-text">JARVIS</div>
        </div>
        <div id="coreState" class="core-status">STANDBY</div>
      </div>

      <!-- Chat Console -->
      <div class="panel console-panel">
        <div class="chat-container" id="chatContainer">
          <div class="msg jarvis">System online. Ready for commands, Sir.</div>
        </div>
        <div class="input-area">
          <span class="prompt">›</span>
          <input id="commandInput" placeholder="Type command..." autocomplete="off">
          <button id="sendBtn" class="btn-send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>
      </div>

      <!-- Mic & System -->
      <div class="bottom-grid">
        <div class="panel mic-panel">
          <div class="mic-status" id="micIndicator">MIC OFF</div>
          <button id="micBtn" class="btn-mic">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          </button>
          <button id="voiceToggle" class="btn-text">🔊 Voice ON</button>
        </div>

        <div class="panel system-panel">
          <div class="sys-row"><span>Operator</span><b id="userName">—</b></div>
          <div class="sys-row"><span>Auth</span><b id="authState">WAITING</b></div>
          <div class="sys-row"><span>Cloud Sync</span><b id="profileState">WAITING</b></div>
          <button id="logoutBtn" class="btn-logout">Sign Out</button>
        </div>
      </div>

    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
