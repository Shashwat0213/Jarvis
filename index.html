<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030a10">
  <title>J.A.R.V.I.S</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid"></div>

  <main class="app">
    <header class="top">
      <div class="brand">J.A.R.V.I.S</div>
      <div class="tools">
        <span class="op" id="userName">—</span>
        <button id="voiceToggle" class="ib" aria-label="Toggle voice replies" aria-pressed="false">🔊</button>
        <button id="logoutBtn" class="ib" aria-label="Log out">⏻</button>
      </div>
    </header>
    <div class="sts">
      <span class="st" id="systemStatus">SYS: OFFLINE</span>
      <span class="st" id="authState">AUTH: WAITING</span>
      <span class="st">CLOUD: <b id="profileState">WAITING</b></span>
    </div>

    <section class="login hidden" id="loginPanel">
      <h2>System locked</h2>
      <p>Sign in with Google to start J.A.R.V.I.S.</p>
      <button id="loginBtn" class="btn">Sign in with Google</button>
    </section>

    <section class="dashboard hidden" id="dashboard">
      <div class="stage" id="core" data-state="idle">
        <div class="core">
          <svg viewBox="0 0 400 400" aria-hidden="true">
            <defs>
              <radialGradient id="orb" cx="40%" cy="35%" r="70%">
                <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
                <stop offset=".4" class="g1"/>
                <stop offset="1" stop-color="#021c2a"/>
              </radialGradient>
            </defs>
            <circle class="s tk r1" cx="200" cy="200" r="190"/>
            <circle class="s ar r2" cx="200" cy="200" r="170"/>
            <circle class="s dh r3" cx="200" cy="200" r="152"/>
            <polygon class="s hx r1" points="334,200 267,316 133,316 66,200 133,84 267,84"/>
            <circle class="s th" cx="200" cy="200" r="112"/>
            <circle class="s ar2 r3" cx="200" cy="200" r="94"/>
            <g class="orb">
              <circle cx="200" cy="200" r="58" fill="url(#orb)"/>
              <text x="201" y="206" text-anchor="middle" class="ot">JARVIS</text>
            </g>
          </svg>
        </div>
        <div class="cs" id="coreState">Standby</div>
        <div class="mic-status" id="micIndicator">VOICE: OFF</div>
      </div>

      <div class="console">
        <div class="chat" id="chatContainer">
          <div class="msg jarvis">Systems initialized. How may I assist you, Sir?</div>
        </div>
        <div class="sugs">
          <button class="sug" data-q="Ek joke sunao">Ek joke sunao</button>
          <button class="sug" data-q="Mera din plan karo">Mera din plan karo</button>
          <button class="sug" data-q="Padhai ke liye study tips do">Study tips</button>
          <button class="sug" data-q="Jarvis, tum kaun ho?">Tum kaun ho?</button>
        </div>
        <div class="dock">
          <button id="micBtn" class="btn-mic" aria-label="Voice command">🎤</button>
          <div class="field">
            <input id="commandInput" placeholder="Type a command" autocomplete="off" enterkeyhint="send">
            <button id="sendBtn" class="send" aria-label="Send">
              <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
